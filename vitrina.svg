<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Ilustración de una vitrina con el hueco vacío donde estaba el trofeo.">
  <rect width="320" height="260" fill="#16211d"/>

  <!-- halo de luz -->
  <ellipse cx="160" cy="210" rx="112" ry="20" fill="#3f8f6f" opacity="0.18"/>

  <!-- vitrina -->
  <rect x="52" y="28" width="216" height="196" fill="none" stroke="#3f8f6f" stroke-width="2.5"/>
  <line x1="52" y1="196" x2="268" y2="196" stroke="#3f8f6f" stroke-width="2.5"/>
  <line x1="160" y1="28" x2="160" y2="196" stroke="#3f8f6f" stroke-width="1" opacity="0.45"/>

  <!-- reflejo del cristal -->
  <path d="M70 224 L150 28 L176 28 L96 224 Z" fill="#ffffff" opacity="0.05"/>

  <!-- peana -->
  <rect x="128" y="176" width="64" height="20" fill="#3f8f6f" opacity="0.35"/>
  <rect x="136" y="168" width="48" height="10" fill="#3f8f6f" opacity="0.55"/>

  <!-- hueco del trofeo -->
  <path d="M132 76 h56 v16 a28 28 0 0 1 -56 0 z M160 120 v30 M140 152 h40"
        fill="none" stroke="#cfe6da" stroke-width="3" stroke-dasharray="7 7" opacity="0.75"/>
  <path d="M132 80 a-14 14 0 0 0 -14 14 a14 14 0 0 0 14 14 M188 80 a14 14 0 0 1 14 14 a14 14 0 0 1 -14 14"
        fill="none" stroke="#cfe6da" stroke-width="3" stroke-dasharray="7 7" opacity="0.75"/>

  <!-- interrogante -->
  <text x="160" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="46"
        font-weight="bold" fill="#cfe6da" opacity="0.9">?</text>

  <!-- etiqueta -->
  <text x="160" y="242" text-anchor="middle" font-family="Verdana, Arial, sans-serif"
        font-size="11" letter-spacing="2.5" fill="#7fb79c">CONCURSO DE ROBOTICA 2026</text>
</svg>
